<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tailwind Tasks</title>

    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="p-5">

    <!-- Task 1 — Text -->
    <h1 class="text-blue-500 font-bold text-center">
        Welcome to Tailwind CSS
    </h1>


    <!-- Task 2 — Box -->
    <div class="p-5 bg-blue-500 rounded-lg">
        This is a Tailwind Box
    </div>


    <!-- Task 3 — Button -->
    <button class="bg-blue-500 text-white px-4 py-2 rounded">
        Click Me
    </button>


    <!-- Task 4 — Two Boxes -->
    <div class="flex gap-4 mt-5">
        <div class="bg-blue-500 p-5">
            Box 1
        </div>

        <div class="bg-blue-500 p-5">
            Box 2
        </div>
    </div>


    <!-- Task 5 — Simple Hover -->
    <button class="bg-blue-500 hover:bg-blue-700 text-white px-4 py-2 rounded mt-5">
        Hover Me
    </button>

</body>
</html>
