<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Product Cards</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: white;
            padding: 30px;
        }

        .product-container {
            max-width: 1200px;
            margin: auto;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 25px;
        }

        .product-card {
            background-color: white;
            border-radius: 10px;
            padding: 20px;
            text-align: center;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);
        }

        .product-card img {
            width: 100%;
            height: 200px;
            border-radius: 8px;
            margin-bottom: 15px;
        }

        .product-card h2 {
            font-size: 20px;
            margin-bottom: 10px;
        }

        .price {
            font-size: 18px;
            font-weight: bold;
            color: #333;
            margin-bottom: 15px;
        }

        .buy-btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 6px;
            background-color: #007bff;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        .buy-btn:hover {
            background-color: #0056b3;
        }

        /* TABLET
           2 cards per row
           Light Blue background
        */
        @media (max-width: 1024px) {
            body {
                background-color: lightblue;
            }

            .product-container {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        /* MOBILE
           1 card per row
           Light Green background
        */
        @media (max-width: 600px) {
            body {
                background-color: lightgreen;
            }

            .product-container {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

    <div class="product-container">

        <!-- Product 1 -->
        <div class="product-card">
            <img src="./productimage1.jpg" alt="Product 1">
            <h2>Product 1</h2>
            <p class="price">300₹</p>
            <button class="buy-btn">Buy Now</button>
        </div>

        <!-- Product 2 -->
        <div class="product-card">
            <img src="./image2.jpg" alt="Product 2">
            <h2>Product 2</h2>
            <p class="price">500₹</p>
            <button class="buy-btn">Buy Now</button>
        </div>

        <!-- Product 3 -->
        <div class="product-card">
            <img src="./image3.jpg" alt="Product 3">
            <h2>Product 3</h2>
            <p class="price">250₹</p>
            <button class="buy-btn">Buy Now</button>
        </div>

        
    </div>

</body>
</html>
