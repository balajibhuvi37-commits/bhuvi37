<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Favorite Things</title>

    <style>
        .place{
            background-color: lightgreen;
            color: darkgreen;
            width: 300px;
            height: 60px;
            text-align: center;
        }

        .actor{
            background-color: lightpink;
            color: darkred;
            width: 300px;
            height: 60px;
            text-align: center;
        }

        .sport{
            background-color: lightyellow;
            color: brown;
            width: 300px;
            height: 60px;
            text-align: center;
        }
    </style>
</head>
<body>

    <!-- Inline CSS -->
    <div style="background-color: lightblue; color: blue; width: 300px; height: 60px; text-align: center;">
        <h3>Favorite Food</h3>
        <p>Biryani</p>
    </div>

    <div style="background-color: lavender; color: purple; width: 300px; height: 60px; text-align: center;">
        <h3>Favorite Movie</h3>
        <p>Leo</p>
    </div>

    <!-- Internal CSS -->
    <div class="place">
        <h3>Favorite Place</h3>
        <p>Ooty</p>
    </div>

    <div class="actor">
        <h3>Favorite Actor</h3>
        <p>Vijay</p>
    </div>

    <div class="sport">
        <h3>Favorite Sport</h3>
        <p>Cricket</p>
    </div>

</body>
</html>
