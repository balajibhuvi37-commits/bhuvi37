<!DOCTYPE html>
<html lang="en">
<head>
  <style>
    .box{
        margin:0;
        width:200px;
        height: 200px;
        background: red;
        color: white;
    }

    .none{
        display: none;
    }
    .hidden{
         visibility: hidden;
    }
  </style>
</head>
<body>
    <h2>display:none</h2>
     <div class="box">box1</div>
     <div  class="box">box2</div>
     <div class="box">box3</div>

     <h2>visibility:hidden</h2>
     <div class="box">box1</div>
     <div class="box">box2</div>
     <div class="box">box3</div>
</body>
</html>
