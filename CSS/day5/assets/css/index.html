<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Booking</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <nav class="navbar">
        <div class="logo">🎬 MovieZone</div>

        <ul class="menu">
            <li><a href="#">Home</a></li>
            <li><a href="#">About</a></li>
            <li><a href="#">Contact</a></li>
            <li><a href="#">Book Ticket</a></li>
        </ul>
    </nav>
    <section class="cards">

        <div class="card">
            <img src="./leoimage.jpg" alt="Movie">
            <h2>Leo</h2>
            <p>Action | Thriller</p>
            <button>Book Now</button>
        </div>
        <div class="card">
            <img src="./jailerimages.jpg" alt="Movie">
            <h2>Jailer</h2>
            <p>Action | Drama</p>
            <button>Book Now</button>
        </div>

        <div class="card">
            <img src="./vikramimage.jpg" alt="Movie">
            <h2>Vikram</h2>
            <p>Action | Crime</p>
            <button>Book Now</button>
        </div>

    </section>

</body>
</html>
