<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Portfolio</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

    
    <nav class="navbar navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="">My Portfolio</a>

            <a class="btn btn-primary" href="contact">Contact</a>
        </div>
    </nav>


    
    <div class="container text-center py-5">

        <h1 class="text-primary">Welcome to My Portfolio</h1>

        <p class="text-muted">
            I am a Web Development Student
        </p>

        <button class="btn btn-success">
            View Profile
        </button>

    </div>



    <div class="container">

        <h2 class="text-center mb-4">My Skills</h2>

        <div class="row">

        
            <div class="col-md-4 mb-3">
                <div class="card">
                    <div class="card-body text-center">
                        <h5 class="card-title">HTML</h5>
                        <p class="card-text">
                            I can create web pages using HTML.
                        </p>
                        <button class="btn btn-primary">Learn More</button>
                    </div>
                </div>
            </div>

        
            <div class="col-md-4 mb-3">
                <div class="card">
                    <div class="card-body text-center">
                        <h5 class="card-title">CSS</h5>
                        <p class="card-text">
                            I can design websites using CSS.
                        </p>
                        <button class="btn btn-warning">Learn More</button>
                    </div>
                </div>
            </div>

            
            <div class="col-md-4 mb-3">
                <div class="card">
                    <div class="card-body text-center">
                        <h5 class="card-title">Bootstrap</h5>
                        <p class="card-text">
                            I can create responsive websites.
                        </p>
                        <button class="btn btn-success">Learn More</button>
                    </div>
                </div>
            </div>

        </div>
    </div>


   
    <div id="" class="container text-center py-5 " >
        <h2>Contact Me</h2>

        <button class="btn btn-danger">
            Contact
        </button>

    </div>

</body>
</html>
