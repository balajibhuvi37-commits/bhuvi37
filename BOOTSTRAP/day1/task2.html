<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Two Column Layout</title>

    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

    <div class="container mt-4">

        <div class="row">

            
            <div class="col-6 bg-primary text-white p-4">
                <h2 class="bg-danger mt-4">Left Section</h2>
                <p>
                    This is the left side of the webpage.
                </p>
            </div>

            

            <div class="col-6 bg-secondary text-white p-4">
                <h2 class="bg-info mt-1">Right Section</h2>
                <p>
                    This is the right side of the webpage.
                </p>
            </div>

        </div>

    </div>

</body>
</html>
