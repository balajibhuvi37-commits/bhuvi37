<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SHOWCASE</title>
</head>
<body>
    <h1>IMAGE GALLERY</h1>
     
    <section>
        <div>
            <img src="asset/image/1.jpg" alt="image GALLERY" width="200" height="200" >
            <img src="asset/image/2.jpg" alt="image gallery" width="200" height="200">
        </div>
    </section>
           <BR></BR>

    <h1>AUDIO PLAYER</h1>
     
    <section>
        <div>
            <audio controls loop>
             <source src="audio1.mpeg" type="audio/mpeg"> 
            </audio>
        </div>
    </section>
        <BR></BR>
     
       <h1>VIDEO PLAYER</h1>
    <section>
        <div>
           <video controls loop poster="poster2.jpeg" width="200" height="200" autoplay >
            <source src="video1.mp4" type="video/mp4">
           </video>
        </div>
    </section>
    <br><br>
      
    <h1>youtube </h1>
    <section>
        <div>
           <iframe width="560" height="315" src="https://www.youtube.com/embed/YoORV1QrVC0?si=LOSSuqbnRU4Jh9lQ" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
        </div>
    </section>

    <br><br>
