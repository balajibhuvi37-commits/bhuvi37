<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VIDEO PLAYER</title>
</head>
<body>
    <h1>video player</h1>
    <section>
        <div>
            <video controls loop width="200" height="200" poster="poster.jpg" >
                <source src="video1.mp4" type="video/mp4">
                
            </video>
        </div>
    </section>

    <section>
        <div>
            <video controls loop width="200" height="200" poster="poster2.jpeg">
                <source src="video2.mp4" type="video/mp4">
            </video>
        </div>
    </section>
</body>
</html>
