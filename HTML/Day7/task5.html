<!DOCTYPE html>
<html>
<head>
    <title>Product Registration & Inventory Report</title>
</head>
<body>

    <h1>Electronics Shop Inventory System</h1>
    <h2>Product Registration Form</h2>

    <form>

        <label>Product ID:</label><br>
        <input type="text" name="productid"><br><br>

        <label>Product Name:</label><br>
        <input type="text" name="productname"><br><br>

        <label>Brand:</label><br>
        <input type="text" name="brand"><br><br>

        <label>Category:</label><br>
        <select name="category">
            <option disabled selected>select one</option>
            <option>Mobile</option>
            <option>Laptop</option>
            <option>Television</option>
            <option>Headphones</option>
            <option>Smart Watch</option>
        </select><br><br>

        <label>Price:</label><br>
        <input type="number" name="price"><br><br>

        <label>Quantity:</label><br>
        <input type="number" name="quantity"><br><br>

        <label>Supplier:</label><br>
        <input type="text" name="supplier"><br><br>

        <label>Product Image:</label><br>
        <input type="file" name="productimage"><br><br>

        <input type="submit" value="Submit">
        <input type="reset" value="Reset">

    </form>

    <hr>

    <h2>Inventory Report</h2>

    <table border="1" cellpadding="10">
        <thead>
            <tr>
                <th>Product ID</th>
                <th>Product Name</th>
                <th>Brand</th>
                <th>Price</th>
                <th>Quantity</th>
                <th>Stock Status</th>
            </tr>
        </thead>

        <tbody>
            <tr>
                <td>P101</td>
                <td>iPhone 16</td>
                <td>Apple</td>
                <td>₹79,999</td>
                <td>20</td>
                <td>In Stock</td>
            </tr>

            <tr>
                <td>P102</td>
                <td>Galaxy S25</td>
                <td>Samsung</td>
                <td>₹74,999</td>
                <td>10</td>
                <td>Low Stock</td>
            </tr>

            <tr>
                <td>P103</td>
                <td>Inspiron 15</td>
                <td>Dell</td>
                <td>₹55,000</td>
                <td>0</td>
                <td>Out of Stock</td>
            </tr>
        </tbody>

    </table>

</body>
</html>
