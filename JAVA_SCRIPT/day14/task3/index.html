<!DOCTYPE html>
<html>
<head>
    <title>Smooth Card Toggle</title>

    <style>
        .card {
            width: 250px;
            padding: 20px;
            border: 1px solid rgb(32, 29, 29);
            border-radius: 10px;
        }

        .card img {
            width: 250px;
            border-radius: 10px;
        }

        .details {
            max-height: 0;
            opacity: 0;
            overflow: hidden;
            transition: 0.5s;
        }

        .details.show {
            max-height: 150px;
            opacity: 1;
        }
    </style>
</head>

<body>

    <div class="card">

        <img src="student.avif" alt="Sample Image">

        <h2>My Card</h2>

        <div class="details" id="details">
            <p>
                This is the card description.
                Click the button to show or hide these details.
            </p>
        </div>

        <button id="btn">Show Details</button>

    </div>

    <script>
        let details = document.getElementById("details");
        let button = document.getElementById("btn");

        button.addEventListener("click", function() {

            details.classList.toggle("show");

            if (details.classList.contains("show")) {
                button.textContent = "Hide details";
            } else {
                button.textContent = "show details";
            }

        });
    </script>

</body>
</html>
